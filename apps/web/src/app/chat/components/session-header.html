<header class="session-header">
  <button
    class="icon-button"
    type="button"
    (click)="menuPressed.emit()"
    [attr.aria-label]="'a11y.menu' | transloco"
  >
    <svg lucideMenu size="18" strokeWidth="2" aria-hidden="true"></svg>
  </button>

  <div class="session-title">
    <keppt-monogram [size]="26" />
    <span class="subtitle">
      <keppt-status-dot />
      <span>{{ subtitle() }}</span>
    </span>
  </div>

  <button
    class="icon-button"
    type="button"
    [attr.aria-label]="'a11y.moreOptions' | transloco"
  >
    <svg
      lucideMoreHorizontal
      size="18"
      strokeWidth="2"
      aria-hidden="true"
    ></svg>
  </button>
</header>
