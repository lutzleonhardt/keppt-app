<footer class="composer" [attr.aria-label]="'composer.a11y.region' | transloco">
  <label class="composer-pill">
    <span class="visually-hidden">{{ "composer.a11y.message" | transloco }}</span>
    <textarea
      #composerInput
      [value]="draft()"
      rows="1"
      [placeholder]="'composer.placeholder' | transloco"
      (input)="updateDraft($event)"
      (keydown.enter)="submitFromEnter($event)"
    ></textarea>

    <div class="composer-actions">
      @if (busy()) {
        <button
          class="action-button stop"
          type="button"
          [attr.aria-label]="'composer.a11y.stop' | transloco"
          (click)="cancelMessage.emit()"
        >
          <svg lucideX size="16" strokeWidth="2" aria-hidden="true"></svg>
        </button>
      } @else {
        <button
          class="action-button mic"
          type="button"
          [attr.aria-label]="'composer.a11y.mic' | transloco"
          (click)="openMic.emit()"
        >
          <svg lucideMic size="16" strokeWidth="2" aria-hidden="true"></svg>
        </button>

        @if (hasDraft()) {
          <button
            class="action-button"
            type="button"
            [attr.aria-label]="'composer.a11y.send' | transloco"
            [disabled]="!canSubmit()"
            (click)="submitMessage.emit()"
          >
            <svg lucideArrowRight size="16" strokeWidth="2" aria-hidden="true"></svg>
          </button>
        }
      }
    </div>
  </label>
</footer>
